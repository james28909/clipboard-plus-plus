name: Bug report
description: Report reproducible incorrect behavior in Clipboard++.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Before posting, remove clipboard contents, credentials, usernames, private paths, and other sensitive data. Attach only a support ZIP you reviewed.
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Click...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clipboard++ version
      placeholder: 0.1.0-beta.7
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 build 26100
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and its attachments for clipboard content and secrets.
          required: true
