<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="cTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- Cylinder side body (left-side, bottom arc, right-side; top is open) -->
  <!-- sweep=1 on bottom arc gives the near/front arc curving downward -->
  <path d="M 68,160 L 68,368 A 188,50 0 0,1 444,368 L 444,160"
        fill="url(#cBody)" stroke="#111" stroke-width="20"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Bottom face (dark, gives depth) -->
  <ellipse cx="256" cy="368" rx="188" ry="50"
           fill="#BF360C" stroke="#111" stroke-width="20"/>

  <!-- Shelf ring 1 — front arc only, at 1/3 height -->
  <path d="M 68,229 A 188,50 0 0,1 444,229"
        fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>

  <!-- Shelf ring 2 — front arc only, at 2/3 height -->
  <path d="M 68,299 A 188,50 0 0,1 444,299"
        fill="none" stroke="#111" stroke-width="15" stroke-linecap="round"/>

  <!-- Top face (bright, highlighted — drawn last so it sits on top) -->
  <ellipse cx="256" cy="160" rx="188" ry="50"
           fill="url(#cTop)" stroke="#111" stroke-width="20"/>
</svg>
