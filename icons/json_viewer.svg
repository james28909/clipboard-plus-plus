<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lensRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CE93D8"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
    <linearGradient id="lensFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#CE93D8"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E24AA"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <clipPath id="lensClip">
      <circle cx="204" cy="198" r="136"/>
    </clipPath>
  </defs>

  <!-- Handle outline (drawn first, behind lens) -->
  <line x1="316" y1="316" x2="462" y2="462"
        stroke="#111" stroke-width="76" stroke-linecap="round"/>
  <!-- Handle fill -->
  <line x1="316" y1="316" x2="462" y2="462"
        stroke="url(#handle)" stroke-width="54" stroke-linecap="round"/>

  <!-- Lens outer ring (black outline) -->
  <circle cx="204" cy="198" r="158" fill="#111"/>
  <!-- Lens fill -->
  <circle cx="204" cy="198" r="136" fill="url(#lensFill)"/>

  <!-- { } text clipped to lens area -->
  <text x="204" y="254"
        font-family="'Courier New', Consolas, monospace"
        font-size="148" font-weight="bold"
        text-anchor="middle"
        fill="#6A1B9A" stroke="#111" stroke-width="10" paint-order="stroke"
        clip-path="url(#lensClip)">{}</text>

  <!-- Lens shine (small highlight arc top-left) -->
  <ellipse cx="158" cy="148" rx="38" ry="22"
           fill="rgba(255,255,255,0.45)" transform="rotate(-30 158 148)"/>
</svg>
